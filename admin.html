<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Flavor House</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  --accent: #FF6B35;
  --dark: #090909; --dark2: #111111; --dark3: #1a1a1a; --dark4: #222222;
  --surface: rgba(255,255,255,0.04); --surface2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
  --text: #f0f0f0; --text2: #888; --text3: #555;
  --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --info: #3b82f6;
  --radius: 12px; --radius2: 20px; --sidebar: 260px;
  --font: 'Inter', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--dark);color:var(--text);min-height:100vh;display:flex}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--dark4);border-radius:2px}
img{display:block} button{cursor:pointer;font-family:var(--font)}
input,select,textarea{font-family:var(--font)}
.hidden{display:none!important}

/* ── Login ── */
#login-screen{position:fixed;inset:0;z-index:999;background:var(--dark);display:flex;align-items:center;justify-content:center}
.login-card{width:100%;max-width:400px;padding:48px 40px;background:var(--dark2);border:1px solid var(--border2);border-radius:var(--radius2);animation:loginIn .5s cubic-bezier(0.4,0,0.2,1)}
@keyframes loginIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo h1{font-size:26px;font-weight:800}
.login-logo h1 span{color:var(--accent)}
.login-logo p{font-size:14px;color:var(--text2);margin-top:6px}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12px;font-weight:600;color:var(--text2);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.form-control{width:100%;padding:12px 16px;background:var(--dark3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:15px;outline:none;transition:border-color .2s}
.form-control:focus{border-color:var(--accent)}
.form-control::placeholder{color:var(--text3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:50px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;border:none;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 16px rgba(255,107,53,.3)}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border2)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-outline{background:transparent;color:var(--text2);border:1px solid var(--border2)}
.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-success{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.25)}
.btn-danger{background:rgba(239,68,68,.12);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
.btn-danger:hover{background:rgba(239,68,68,.25)}
.btn-warning{background:rgba(245,158,11,.12);color:var(--warning);border:1px solid rgba(245,158,11,.2)}
.btn-sm{padding:7px 14px;font-size:12px}
.btn-xs{padding:4px 10px;font-size:11px;border-radius:6px}
#login-err{color:var(--danger);font-size:13px;margin-bottom:12px;display:none;padding:10px 14px;background:rgba(239,68,68,.1);border-radius:var(--radius)}
.login-hint{text-align:center;margin-top:16px;font-size:12px;color:var(--text3)}

/* ── Sidebar ── */
#sidebar{width:var(--sidebar);flex-shrink:0;background:var(--dark2);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;overflow-y:auto}
.sidebar-logo{padding:28px 24px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo h2{font-size:18px;font-weight:800}
.sidebar-logo h2 span{color:var(--accent)}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:4px}
.sidebar-nav{padding:16px 12px;flex:1}
.nav-section-label{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:2px;text-transform:uppercase;padding:8px 12px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius);font-size:14px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;margin-bottom:2px;border:none;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(255,107,53,.12);color:var(--accent)}
.nav-item .icon{font-size:17px;width:22px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--danger);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
.sidebar-user{display:flex;align-items:center;gap:12px;padding:10px;border-radius:var(--radius);margin-bottom:8px}
.sidebar-user-avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,107,53,.2);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sidebar-user-info p{font-size:13px;font-weight:600}
.sidebar-user-info span{font-size:11px;color:var(--text3)}
.nav-external{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:var(--radius);font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;transition:all .2s;margin-bottom:2px;text-decoration:none;width:100%}
.nav-external:hover{background:var(--surface2);color:var(--text2)}
.nav-external .icon{font-size:15px;width:22px;text-align:center}

/* ── Main ── */
#main-content{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
#topbar{height:64px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:var(--dark);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50}
.topbar-left h1{font-size:20px;font-weight:700}
.topbar-left p{font-size:13px;color:var(--text3)}
.topbar-right{display:flex;align-items:center;gap:12px}
.realtime-dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{box-shadow:0 0 0 6px rgba(34,197,94,0)}}
#page{flex:1;padding:28px 32px;overflow-y:auto;background:var(--dark)}

/* ── Stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--radius2);padding:22px 24px;transition:all .25s}
.stat-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.stat-icon{font-size:24px;margin-bottom:12px}
.stat-value{font-size:28px;font-weight:800;margin-bottom:4px}
.stat-label{font-size:13px;color:var(--text2)}
.stat-change{font-size:12px;margin-top:6px;color:var(--text3)}

/* ── Charts ── */
.chart-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:28px}
.chart-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--radius2);padding:24px}
.chart-card h3{font-size:15px;font-weight:700;margin-bottom:20px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}

/* ── Table ── */
.table-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden}
.table-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-header h3{font-size:15px;font-weight:700}
.table-filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.filter-select{padding:7px 12px;background:var(--dark3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text2);font-size:13px;outline:none;cursor:pointer}
.search-field{padding:7px 14px;background:var(--dark3);border:1px solid var(--border2);border-radius:50px;color:var(--text);font-size:13px;outline:none;width:180px;transition:all .2s}
.search-field:focus{border-color:var(--accent);width:220px}
.search-field::placeholder{color:var(--text3)}
.data-table{width:100%;border-collapse:collapse}
.data-table th{padding:12px 20px;font-size:11px;font-weight:700;color:var(--text3);letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.data-table td{padding:14px 20px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,.02)}
.table-overflow{overflow-x:auto}

/* ── Badges ── */
.badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-pending{background:rgba(59,130,246,.15);color:var(--info)}
.badge-confirmed{background:rgba(245,158,11,.12);color:var(--warning)}
.badge-preparing{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-ready{background:rgba(34,197,94,.12);color:var(--success)}
.badge-done{background:rgba(255,255,255,.06);color:var(--text2)}
.badge-cancelled{background:rgba(239,68,68,.12);color:var(--danger)}
.badge-active{background:rgba(34,197,94,.12);color:var(--success)}
.badge-inactive{background:rgba(239,68,68,.1);color:var(--danger)}
.badge-featured{background:rgba(255,107,53,.15);color:var(--accent)}
.badge-scheduled{background:rgba(139,92,246,.15);color:#8b5cf6}
.status-select{padding:5px 10px;background:var(--dark3);border:1px solid var(--border2);border-radius:50px;color:var(--text);font-size:12px;outline:none;cursor:pointer}

/* ── Menu grid ── */
.menu-admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:24px}
.menu-admin-card{background:var(--dark3);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;transition:all .25s}
.menu-admin-card:hover{border-color:var(--border2);transform:translateY(-2px)}
.menu-admin-img{height:140px;overflow:hidden;position:relative}
.menu-admin-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.menu-admin-card:hover .menu-admin-img img{transform:scale(1.05)}
.menu-admin-body{padding:14px}
.menu-admin-name{font-size:15px;font-weight:700;margin-bottom:2px}
.menu-admin-sub{font-size:12px;color:var(--text2);margin-bottom:10px}
.menu-admin-price{font-size:17px;font-weight:800;color:var(--accent);margin-bottom:12px}
.menu-admin-actions{display:flex;gap:6px;flex-wrap:wrap}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--dark2);border:1px solid var(--border2);border-radius:var(--radius2);padding:36px;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;animation:modalIn .3s cubic-bezier(0.4,0,0.2,1)}
@keyframes modalIn{from{opacity:0;transform:translateY(20px)scale(.97)}to{opacity:1;transform:translateY(0)scale(1)}}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px}
.modal-header h2{font-size:20px;font-weight:700}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--border2);color:var(--text2);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.img-preview{width:100%;height:140px;object-fit:cover;border-radius:var(--radius);background:var(--dark3);margin-top:8px;display:none}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:var(--dark4);border-radius:12px;cursor:pointer;transition:.3s}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--accent)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border-bottom:none}

/* ── Toast ── */
#toast-root{position:fixed;bottom:24px;right:24px;z-index:999;display:flex;flex-direction:column;gap:10px}
.toast{padding:12px 20px;border-radius:50px;font-size:13px;font-weight:600;backdrop-filter:blur(16px);box-shadow:0 8px 32px rgba(0,0,0,.5);animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast-success{background:rgba(34,197,94,.92);color:#fff}
.toast-error{background:rgba(239,68,68,.92);color:#fff}
.toast-info{background:rgba(255,107,53,.92);color:#fff}

/* ── Settings ── */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.settings-card{background:var(--dark2);border:1px solid var(--border);border-radius:var(--radius2);padding:24px}
.settings-card h3{font-size:14px;font-weight:700;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--border)}
@media(max-width:700px){.settings-grid,.form-grid{grid-template-columns:1fr}}

/* ── Analytics ── */
.top-items-list{display:flex;flex-direction:column;gap:12px}
.top-item-row{display:flex;align-items:center;gap:12px}
.top-item-bar-wrap{flex:1;height:6px;background:var(--dark3);border-radius:3px;overflow:hidden}
.top-item-bar{height:100%;background:var(--accent);border-radius:3px;transition:width .6s ease}
.top-item-name{font-size:13px;min-width:120px;color:var(--text2)}
.top-item-count{font-size:13px;font-weight:700;min-width:28px;text-align:right}

/* ── Mobile ── */
@media(max-width:768px){
  #sidebar{display:none}
  #page{padding:16px}
  #topbar{padding:0 16px}
  .stat-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <h1>Flavor<span>House</span></h1>
      <p>Admin Dashboard</p>
    </div>
    <div id="login-err"></div>
    <div class="form-group">
      <label class="form-label">Username</label>
      <input class="form-control" id="loginEmail" type="text" placeholder="admin" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input class="form-control" id="loginPass" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" onclick="doLogin()" style="width:100%;padding:13px;margin-top:4px" id="loginBtn">Sign In</button>
    <div class="login-hint">Use: admin / admin123</div>
  </div>
</div>

<!-- ── App Shell ── -->
<div id="app-shell" class="hidden" style="display:flex;width:100%">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <h2>Flavor<span>House</span></h2>
      <p>Admin Panel v2</p>
    </div>
    <nav class="sidebar-nav">

      <div class="nav-section-label">Overview</div>
      <button class="nav-item active" onclick="navigate('dashboard')" id="nav-dashboard">
        <span class="icon">📊</span> Dashboard
      </button>

      <div class="nav-section-label">Operations</div>
      <button class="nav-item" onclick="navigate('orders')" id="nav-orders">
        <span class="icon">📋</span> Orders
        <span class="badge hidden" id="pendingBadge">0</span>
      </button>
      <button class="nav-item" onclick="navigate('heatmap')" id="nav-heatmap">
        <span class="icon">🗺️</span> Table Heatmap
      </button>
      <button class="nav-item" onclick="navigate('menu')" id="nav-menu">
        <span class="icon">🍕</span> Menu Items
      </button>
      <button class="nav-item" onclick="navigate('tables')" id="nav-tables">
        <span class="icon">🪑</span> Tables & NFC
      </button>

      <div class="nav-section-label">Intelligence</div>
      <button class="nav-item" onclick="navigate('analytics')" id="nav-analytics">
        <span class="icon">📈</span> Analytics
      </button>
      <button class="nav-item" onclick="navigate('feedback')" id="nav-feedback">
        <span class="icon">⭐</span> Feedback
      </button>
      <button class="nav-item" onclick="navigate('loyalty')" id="nav-loyalty">
        <span class="icon">🎟️</span> Loyalty Members
      </button>

      <div class="nav-section-label">Config</div>
      <button class="nav-item" onclick="navigate('settings')" id="nav-settings">
        <span class="icon">⚙️</span> Settings
      </button>

      <div class="nav-section-label">Staff Tools</div>
      <a class="nav-external" href="kitchen.html" target="_blank">
        <span class="icon">👨‍🍳</span> Kitchen Display ↗
      </a>
      <a class="nav-external" href="waiter.html" target="_blank">
        <span class="icon">🫱</span> Waiter Mode ↗
      </a>

    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar">👑</div>
        <div class="sidebar-user-info">
          <p id="adminEmail">Admin</p>
          <span>Administrator</span>
        </div>
      </div>
      <button class="nav-item" onclick="doLogout()" style="color:var(--danger)">
        <span class="icon">🚪</span> Sign Out
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSubtitle">Overview & key metrics</p>
      </div>
      <div class="topbar-right">
        <span class="realtime-dot"></span>
        <span style="font-size:12px;color:var(--text3)">Live</span>
        <a href="kitchen.html" target="_blank" class="btn btn-ghost btn-sm">👨‍🍳 Kitchen</a>
        <a href="index.html" target="_blank" class="btn btn-ghost btn-sm">↗ View Site</a>
      </div>
    </header>
    <main id="page"></main>
  </div>
</div>

<div id="toast-root"></div>
<div id="modal-root"></div>

<script src="db.js"></script>
<script src="admin.js"></script>
</body>
</html>
