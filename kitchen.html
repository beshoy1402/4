<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Display — Flavor House</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍🍳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root {
  --green: #22c55e; --yellow: #f59e0b; --red: #ef4444; --blue: #3b82f6;
  --dark: #0a0a0a; --dark2: #111; --dark3: #1a1a1a; --dark4: #222;
  --text: #f0f0f0; --text2: #aaa; --text3: #555;
  --accent: #FF6B35;
  --border: rgba(255,255,255,0.08);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--dark);color:var(--text);min-height:100vh;overflow-x:hidden}
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

/* Header */
#kds-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;background:var(--dark2);border-bottom:1px solid var(--border);
  position:sticky;top:0;z-index:50;
}
.kds-logo{font-size:18px;font-weight:800;color:var(--text)}
.kds-logo span{color:var(--accent)}
.kds-stats{display:flex;gap:20px;align-items:center}
.kds-stat{text-align:center}
.kds-stat-num{font-size:22px;font-weight:800}
.kds-stat-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.kds-time{font-size:24px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;align-items:center}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.leg-dot{width:10px;height:10px;border-radius:50%}

/* Sound btn */
.sound-btn{
  padding:8px 16px;border-radius:50px;border:1px solid var(--border);
  background:var(--dark3);color:var(--text2);font-size:13px;cursor:pointer;
  transition:all .2s;
}
.sound-btn.on{border-color:var(--green);color:var(--green)}

/* Grid */
#kds-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;padding:20px;
}

/* Order card */
.kds-card{
  border-radius:16px;border:2px solid transparent;
  background:var(--dark2);overflow:hidden;
  animation:cardIn .35s cubic-bezier(0.4,0,0.2,1);
  transition:border-color .3s;
  display:flex;flex-direction:column;
}
@keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.kds-card.age-fresh{border-color:rgba(34,197,94,.4)}
.kds-card.age-warn{border-color:rgba(245,158,11,.5)}
.kds-card.age-urgent{border-color:rgba(239,68,68,.6);animation:urgentPulse 1.5s ease-in-out infinite}
@keyframes urgentPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

.kds-card-header{
  padding:14px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);
}
.kds-order-num{font-size:22px;font-weight:800;color:var(--accent)}
.kds-table{font-size:14px;color:var(--text2);margin-top:2px}
.kds-age{font-size:13px;font-weight:700;padding:4px 10px;border-radius:50px}
.age-fresh .kds-age{background:rgba(34,197,94,.15);color:var(--green)}
.age-warn .kds-age{background:rgba(245,158,11,.15);color:var(--yellow)}
.age-urgent .kds-age{background:rgba(239,68,68,.15);color:var(--red)}

.kds-items{padding:12px 16px;flex:1}
.kds-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-bottom:1px solid var(--border);
  font-size:15px;
}
.kds-item:last-child{border-bottom:none}
.kds-item-name{font-weight:600}
.kds-item-qty{
  font-size:18px;font-weight:800;
  width:36px;height:36px;border-radius:50%;
  background:var(--dark3);display:flex;align-items:center;justify-content:center;
  color:var(--accent);flex-shrink:0;
}
.kds-notes{padding:0 16px 12px;font-size:13px;color:var(--yellow);font-style:italic}

/* Progress bar */
.kds-timer-bar{height:4px;background:var(--dark3);position:relative;overflow:hidden}
.kds-timer-fill{height:100%;transition:width .5s linear;border-radius:0}
.age-fresh .kds-timer-fill{background:var(--green)}
.age-warn .kds-timer-fill{background:var(--yellow)}
.age-urgent .kds-timer-fill{background:var(--red)}

/* Action buttons */
.kds-actions{display:flex;gap:0;border-top:1px solid var(--border)}
.kds-btn{
  flex:1;padding:14px 8px;border:none;background:transparent;
  color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;letter-spacing:.3px;
}
.kds-btn:hover{background:var(--dark3);color:var(--text)}
.kds-btn:not(:last-child){border-right:1px solid var(--border)}
.kds-btn.confirm{color:var(--blue)}
.kds-btn.confirm:hover{background:rgba(59,130,246,.1)}
.kds-btn.prepare{color:var(--yellow)}
.kds-btn.prepare:hover{background:rgba(245,158,11,.1)}
.kds-btn.ready{color:var(--green);font-size:14px}
.kds-btn.ready:hover{background:rgba(34,197,94,.1)}
.kds-btn.cancel{color:var(--red)}
.kds-btn.cancel:hover{background:rgba(239,68,68,.1)}

/* Status badge on card */
.kds-status{font-size:11px;padding:3px 9px;border-radius:50px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.s-pending{background:rgba(59,130,246,.15);color:var(--blue)}
.s-confirmed{background:rgba(245,158,11,.12);color:var(--yellow)}
.s-preparing{background:rgba(245,158,11,.15);color:var(--yellow)}
.s-ready{background:rgba(34,197,94,.12);color:var(--green)}

/* Empty state */
#empty-state{
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:100px 20px;text-align:center;color:var(--text3);
}
#empty-state .icon{font-size:72px;margin-bottom:20px}
#empty-state p{font-size:18px}

/* New order flash */
#flash{
  position:fixed;inset:0;background:rgba(34,197,94,.08);
  pointer-events:none;z-index:999;opacity:0;transition:opacity .3s;
}
#flash.show{opacity:1}

/* Completed lane */
#done-section{padding:0 20px 20px}
#done-section h3{font-size:13px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;padding:12px 0 10px;border-top:1px solid var(--border)}
#done-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.done-card{
  padding:12px 14px;border-radius:12px;background:var(--dark3);
  border:1px solid var(--border);opacity:.6;
  display:flex;align-items:center;justify-content:space-between;
}
.done-card-num{font-size:16px;font-weight:700;color:var(--text2)}
.done-card-time{font-size:12px;color:var(--text3)}
</style>
</head>
<body>

<div id="flash"></div>

<header id="kds-header">
  <div>
    <div class="kds-logo">Flavor<span>House</span> <span style="font-size:14px;color:var(--text3);font-weight:400">Kitchen</span></div>
  </div>
  <div class="kds-stats">
    <div class="kds-stat"><div class="kds-stat-num" id="statActive" style="color:var(--yellow)">0</div><div class="kds-stat-label">Active</div></div>
    <div class="kds-stat"><div class="kds-stat-num" id="statDone" style="color:var(--green)">0</div><div class="kds-stat-label">Done today</div></div>
    <div class="kds-stat"><div class="kds-stat-num" id="statUrgent" style="color:var(--red)">0</div><div class="kds-stat-label">Urgent</div></div>
  </div>
  <div style="display:flex;align-items:center;gap:16px">
    <div class="legend">
      <div class="leg"><div class="leg-dot" style="background:var(--green)"></div>&lt;5 min</div>
      <div class="leg"><div class="leg-dot" style="background:var(--yellow)"></div>5–12 min</div>
      <div class="leg"><div class="leg-dot" style="background:var(--red)"></div>&gt;12 min</div>
    </div>
    <button class="sound-btn on" id="soundBtn" onclick="toggleSound()">🔔 Sound ON</button>
    <div class="kds-time" id="clock">--:--</div>
  </div>
</header>

<div id="kds-grid"></div>
<div id="empty-state"><div class="icon">✅</div><p>All clear — no active orders</p></div>
<div id="done-section" style="display:none">
  <h3>Completed today</h3>
  <div id="done-grid"></div>
</div>

<script src="db.js"></script>
<script>
'use strict';

const KDS = {
  orders: {},
  doneOrders: [],
  soundOn: true,
  audioCtx: null,
};

// ── Clock ──────────────────────────────────────────
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

// ── Sound ──────────────────────────────────────────
function toggleSound() {
  KDS.soundOn = !KDS.soundOn;
  const btn = document.getElementById('soundBtn');
  btn.textContent = KDS.soundOn ? '🔔 Sound ON' : '🔕 Sound OFF';
  btn.className = 'sound-btn' + (KDS.soundOn ? ' on' : '');
}

function playChime(type = 'new') {
  if (!KDS.soundOn) return;
  try {
    if (!KDS.audioCtx) KDS.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = KDS.audioCtx;
    const freqs = type === 'new' ? [523, 659, 784] : [784, 659];
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0, ctx.currentTime + i * 0.18);
      gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + i * 0.18 + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.18 + 0.4);
      osc.start(ctx.currentTime + i * 0.18);
      osc.stop(ctx.currentTime + i * 0.18 + 0.5);
    });
  } catch(e) {}
}

// ── Flash ──────────────────────────────────────────
function flashScreen() {
  const el = document.getElementById('flash');
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 600);
}

// ── Age helpers ────────────────────────────────────
function getAge(createdAt) {
  if (!createdAt) return 0;
  const ts = createdAt.toDate ? createdAt.toDate() : new Date(createdAt);
  return Math.floor((Date.now() - ts.getTime()) / 60000);
}

function getAgeClass(mins) {
  if (mins < 5) return 'age-fresh';
  if (mins < 12) return 'age-warn';
  return 'age-urgent';
}

function getTimerWidth(mins) {
  return Math.min(100, Math.round(mins / 15 * 100));
}

// ── Render ─────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('kds-grid');
  const empty = document.getElementById('empty-state');
  const active = Object.values(KDS.orders)
    .filter(o => ['pending','confirmed','preparing','ready'].includes(o.status))
    .sort((a, b) => {
      const ta = a.created_at?.toDate ? a.created_at.toDate() : new Date(a.created_at || 0);
      const tb = b.created_at?.toDate ? b.created_at.toDate() : new Date(b.created_at || 0);
      return ta - tb;
    });

  document.getElementById('statActive').textContent = active.length;
  document.getElementById('statUrgent').textContent = active.filter(o => getAge(o.created_at) >= 12).length;

  if (!active.length) {
    grid.innerHTML = '';
    empty.style.display = 'flex';
  } else {
    empty.style.display = 'none';
    grid.innerHTML = active.map(o => buildCard(o)).join('');
  }

  renderDone();
}

function buildCard(o) {
  const age = getAge(o.created_at);
  const ageClass = getAgeClass(age);
  const timerW = getTimerWidth(age);
  const ageLabel = age < 1 ? 'Just now' : `${age} min`;

  const nextActions = {
    pending:    `<button class="kds-btn confirm" onclick="advance('${o.id}','confirmed')">✓ Confirm</button>`,
    confirmed:  `<button class="kds-btn prepare" onclick="advance('${o.id}','preparing')">👨‍🍳 Start Cooking</button>`,
    preparing:  `<button class="kds-btn ready" onclick="advance('${o.id}','ready')">🔔 Ready!</button>`,
    ready:      `<button class="kds-btn ready" onclick="advance('${o.id}','done')">✅ Served</button>`,
  };

  return `
  <div class="kds-card ${ageClass}" id="kds-card-${o.id}">
    <div class="kds-timer-bar"><div class="kds-timer-fill" style="width:${timerW}%"></div></div>
    <div class="kds-card-header">
      <div>
        <div class="kds-order-num">#${o.order_number}</div>
        <div class="kds-table">Table ${o.table_number}${o.customer_name ? ` · ${o.customer_name}` : ''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <span class="kds-status s-${o.status}">${o.status}</span>
        <span class="kds-age">${ageLabel}</span>
      </div>
    </div>
    <div class="kds-items">
      ${(o.items || []).map(i => `
        <div class="kds-item">
          <span class="kds-item-name">${i.name}</span>
          <span class="kds-item-qty">${i.qty}</span>
        </div>
      `).join('')}
    </div>
    ${o.notes ? `<div class="kds-notes">📝 ${o.notes}</div>` : ''}
    <div class="kds-actions">
      ${nextActions[o.status] || ''}
      <button class="kds-btn cancel" onclick="advance('${o.id}','cancelled')" title="Cancel">✕</button>
    </div>
  </div>`;
}

function renderDone() {
  const sec = document.getElementById('done-section');
  const grid = document.getElementById('done-grid');
  const today = new Date().toDateString();
  const doneToday = Object.values(KDS.orders)
    .filter(o => {
      if (o.status !== 'done') return false;
      const ts = o.created_at?.toDate ? o.created_at.toDate() : new Date(o.created_at || 0);
      return ts.toDateString() === today;
    })
    .sort((a,b) => {
      const ta = a.created_at?.toDate ? a.created_at.toDate() : new Date(a.created_at||0);
      const tb = b.created_at?.toDate ? b.created_at.toDate() : new Date(b.created_at||0);
      return tb - ta;
    });

  document.getElementById('statDone').textContent = doneToday.length;

  if (!doneToday.length) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  grid.innerHTML = doneToday.slice(0,12).map(o => {
    const ts = o.created_at?.toDate ? o.created_at.toDate() : new Date(o.created_at||0);
    return `<div class="done-card">
      <div>
        <div class="done-card-num">#${o.order_number} · Table ${o.table_number}</div>
        <div class="done-card-time">${o.items?.map(i=>i.name).join(', ').slice(0,40)}</div>
      </div>
      <div class="done-card-time">${ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div>
    </div>`;
  }).join('');
}

// ── Update timer bars every 30s ───────────────────
setInterval(() => {
  Object.values(KDS.orders).forEach(o => {
    const card = document.getElementById(`kds-card-${o.id}`);
    if (!card) return;
    const age = getAge(o.created_at);
    const ageClass = getAgeClass(age);
    card.className = `kds-card ${ageClass}`;
    const bar = card.querySelector('.kds-timer-fill');
    if (bar) bar.style.width = getTimerWidth(age) + '%';
    const ageEl = card.querySelector('.kds-age');
    if (ageEl) ageEl.textContent = age < 1 ? 'Just now' : `${age} min`;
  });
}, 30000);

// ── Actions ────────────────────────────────────────
async function advance(id, status) {
  try {
    await DB.updateOrderStatus(id, status);
    if (KDS.orders[id]) KDS.orders[id].status = status;
    if (status === 'done' || status === 'cancelled') {
      playChime('done');
    }
    renderGrid();
  } catch(e) { alert('Failed: ' + e.message); }
}

// ── Realtime ───────────────────────────────────────
function initRealtime() {
  firebase.firestore().collection('orders')
    .where('status', 'in', ['pending','confirmed','preparing','ready','done'])
    .orderBy('created_at', 'desc')
    .limit(100)
    .onSnapshot(snap => {
      let hasNew = false;
      snap.docChanges().forEach(change => {
        const o = { id: change.doc.id, ...change.doc.data() };
        if (change.type === 'added' && !KDS.orders[o.id] && ['pending','confirmed','preparing','ready'].includes(o.status)) {
          hasNew = true;
        }
        KDS.orders[o.id] = o;
      });
      if (hasNew && Object.keys(KDS.orders).length > 0) {
        playChime('new');
        flashScreen();
        // Tab title flash
        let flash = true;
        const origTitle = 'Kitchen Display — Flavor House';
        const iv = setInterval(() => {
          document.title = flash ? '🔔 NEW ORDER!' : origTitle;
          flash = !flash;
        }, 600);
        setTimeout(() => { clearInterval(iv); document.title = origTitle; }, 5000);
      }
      renderGrid();
    });
}

// ── Boot ───────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  // Unlock audio on first click
  document.addEventListener('click', () => {
    if (!KDS.audioCtx) KDS.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }, { once: true });
  initRealtime();
});
</script>
</body>
</html>
